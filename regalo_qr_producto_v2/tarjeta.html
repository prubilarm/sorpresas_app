<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjeta QR</title><style>@page{size:9cm 9cm;margin:0}*{box-sizing:border-box}body{margin:0;background:#eee;font-family:Arial,sans-serif}.card{width:9cm;height:9cm;margin:auto;padding:.55cm;background:radial-gradient(circle at top,#67143a,#27000f 65%);color:#fff;display:grid;grid-template-columns:1fr 3.15cm;align-items:center;gap:.35cm;overflow:hidden}.copy small{display:block;text-transform:uppercase;letter-spacing:.16em;color:#ff9cc4;font-size:7pt}.copy h1{font-family:Georgia,serif;font-size:17pt;line-height:1.05;margin:.18cm 0;color:#fff}.copy p{font-size:8.5pt;line-height:1.35;margin:0;color:#f6d4e2}.qr{width:3.15cm;height:3.15cm;background:#fff;border-radius:.18cm;padding:.12cm;display:grid;place-items:center}.qr img{max-width:100%;max-height:100%}.foot{position:absolute}.screen-note{max-width:700px;margin:24px auto;padding:16px;background:white;color:#222}@media print{body{background:white}.screen-note{display:none}}</style></head><body><div class="screen-note">Reemplaza <strong>assets/qr.png</strong> por el QR definitivo y edita los nombres antes de imprimir. Imprime al 100%, sin ajustar escala.</div><section class="card"><div class="copy"><small>Hecho especialmente para</small><h1>NOMBRE 1 &amp; NOMBRE 2</h1><p>Escanea el código y descubre un recuerdo preparado con mucho amor.</p></div><div class="qr"><img src="assets/qr.png" alt="Código QR"></div></section></body></html>
