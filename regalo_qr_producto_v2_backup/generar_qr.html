<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generar QR</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4f8;color:#2f1220;font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 30px));margin:40px auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 18px 55px #5c123226}h1{font-family:Georgia,serif}input{width:100%;padding:14px;border:1px solid #e5cfd9;border-radius:12px}button{margin-top:12px;border:0;border-radius:999px;padding:14px 20px;background:#e83482;color:#fff;font-weight:800;cursor:pointer}#out{margin-top:22px;text-align:center}img{max-width:280px;background:#fff;padding:10px}</style></head><body><main><h1>Generador de QR</h1><p>Pega la dirección pública de la experiencia. El QR se genera usando un servicio externo, por lo que requiere internet.</p><input id="url" type="url" placeholder="https://tudominio.cl/cliente"><button id="go">Generar QR</button><div id="out"></div></main><script>document.getElementById('go').onclick=()=>{const u=document.getElementById('url').value.trim();if(!/^https:\/\//i.test(u)){alert('La dirección debe comenzar con https://');return}const src='https://api.qrserver.com/v1/create-qr-code/?size=700x700&data='+encodeURIComponent(u);document.getElementById('out').innerHTML='<p>Guarda esta imagen como <strong>qr.png</strong> dentro de la carpeta assets.</p><a href="'+src+'" target="_blank"><img src="'+src+'" alt="QR"></a>'}</script></body></html>
